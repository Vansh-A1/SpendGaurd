[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spendguard"
version = "0.1.0"
description = "SpendGuard: AI Agent Corporate Spend Governance and Four-Pillar Trust Gate SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["sdk"]
